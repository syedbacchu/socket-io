<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Socket.IO Test</title>
</head>
<body>

    <h2>Socket.IO Notification Test</h2>

    <div>
        <label>User ID:</label>
        <input
            type="number"
            id="userId"
            value="123"
        />

        <button onclick="connectSocket()">
            Connect
        </button>
    </div>

    <hr>

    <h3>Connection Status</h3>

    <div id="status">
        Not connected
    </div>

    <h3>Notifications</h3>

    <div id="notifications"></div>


    <script src="http://localhost:3001/socket.io/socket.io.js"></script>

    <script>

        let socket = null;

        function connectSocket() {

            const userId =
                document.getElementById("userId").value;

            if (!userId) {
                alert("User ID is required.");
                return;
            }

            socket = io("http://localhost:3001");

            socket.on("connect", () => {

                console.log(
                    "Connected:",
                    socket.id
                );

                document.getElementById("status").innerText =
                    "Connected: " + socket.id;

                socket.emit("authenticate", {
                    user_id: Number(userId)
                });
            });


            socket.on("authenticated", (data) => {

                console.log(
                    "Authenticated:",
                    data
                );

                document.getElementById("status").innerText =
                    "Authenticated as User " +
                    data.user_id;
            });


            socket.on("authentication-error", (data) => {

                console.error(
                    "Authentication error:",
                    data
                );
            });


            /*
            |--------------------------------------------------------------------------
            | Public Notification
            |--------------------------------------------------------------------------
            */

            socket.on(
                "public-notification",
                (data) => {

                    console.log(
                        "Public notification:",
                        data
                    );

                    showNotification(
                        "PUBLIC",
                        data
                    );
                }
            );


            /*
            |--------------------------------------------------------------------------
            | Private Notification
            |--------------------------------------------------------------------------
            */

            socket.on(
                "private-notification",
                (data) => {

                    console.log(
                        "Private notification:",
                        data
                    );

                    showNotification(
                        "PRIVATE",
                        data
                    );
                }
            );


            socket.on("disconnect", () => {

                document.getElementById("status").innerText =
                    "Disconnected";

            });

        }


        function showNotification(type, data) {

            const container =
                document.getElementById("notifications");

            const div =
                document.createElement("div");

            div.style.marginBottom = "15px";

            div.innerHTML = `
                <strong>${type}</strong>
                <br>
                <strong>${data.title}</strong>
                <br>
                ${data.message}
                <hr>
            `;

            container.prepend(div);
        }

    </script>

</body>
</html>
